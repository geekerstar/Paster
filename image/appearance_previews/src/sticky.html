<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>
  :root{
    --text:#4CAF50; --link:#2196F3; --code:#FF9800; --image:#E91E63; --files:#9C27B0; --unknown:#9E9E9E;
    --accent:#0078d4; --accent2:#6c5ce7;
    --bg:#f4f5f9; --panel:#ffffff; --ink:#1f2330; --muted:#6b7280; --line:#e6e8ef; --line2:#eef0f6;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6;}
  a{color:var(--accent);text-decoration:none}
  .nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
       border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .nav .brand{font-weight:700;margin-right:10px;letter-spacing:.2px}
  .nav a{font-size:13px;color:var(--muted);padding:5px 10px;border-radius:8px}
  .nav a:hover{background:var(--line2);color:var(--ink)}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 22px 80px}
  .hero{background:linear-gradient(135deg,#0078d4 0%,#6c5ce7 100%);color:#fff;border-radius:20px;padding:34px 36px;margin-bottom:26px;box-shadow:0 18px 40px rgba(40,60,120,.18)}
  .hero h1{margin:0 0 8px;font-size:26px;font-weight:700}
  .hero p{margin:0;opacity:.92;font-size:14px;max-width:840px}
  .hero .chips{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
  .hero .chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px}
  section{margin:46px 0}
  h2.sec{font-size:20px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
  h2.sec .n{display:inline-flex;width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;align-items:center;justify-content:center;font-weight:700}
  .secsub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .meta .k{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}
  .meta .k b{color:var(--accent)}
  .win{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(30,40,80,.10);overflow:hidden}
  .win .bar{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line2);background:#fbfbfd}
  .win .dot{width:11px;height:11px;border-radius:50%}
  .win .title{margin-left:8px;font-size:12.5px;color:var(--muted);font-weight:600}
  .win .body{padding:16px}
  .tchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff}
  .t-text{background:var(--text)} .t-link{background:var(--link)} .t-code{background:var(--code)}
  .t-image{background:var(--image)} .t-files{background:var(--files)} .t-unknown{background:var(--unknown)}
  .dotc{width:8px;height:8px;border-radius:2px;display:inline-block}
  .note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 15px;font-size:13px;margin-top:14px}
  .note b{color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line2)}
  th{background:#f7f8fc;font-weight:700;font-size:12.5px}
  tr:last-child td{border-bottom:none}
  td.k{font-family:"SFMono-Regular",Consolas,monospace;color:var(--accent);white-space:nowrap;font-weight:600}
  .small{font-size:12px;color:var(--muted)}
  .eval{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .eval .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .eval .card h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:7px}
  .eval .card p{margin:0;font-size:12.5px;color:var(--muted)}
  .badge-ok{background:#e7f7ec;color:#1e8e3e;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
  .badge-warn{background:#fff4e5;color:#b25e09;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
  .badge-exp{background:#efe9ff;color:#6c3ce7;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}

  /* ===== 共享布局组件 ===== */
  .tl{position:relative;padding-left:26px}.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tlgroup{margin-bottom:14px}.tlhead{font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 8px;position:relative}
  .tlhead:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
  .tlitem{display:flex;gap:12px;align-items:flex-start;background:#fcfcff;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-bottom:9px;position:relative}
  .tlitem:before{content:"";position:absolute;left:-22px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid #fff}
  .tlmain{flex:1;min-width:0}.tlmain .tt{font-size:13px;font-weight:600;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tlmain .tx{font-size:12px;color:var(--muted);margin:0}
  .tlact{display:flex;flex-direction:column;gap:6px;opacity:.55}.tlact span{width:22px;height:22px;border-radius:7px;background:#eef1f7;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:700}
  .tltime{font-size:11px;color:var(--muted);margin-top:3px}
  .kanban{display:flex;gap:12px;overflow:hidden}.col{flex:1;min-width:0;background:#fafbff;border:1px solid var(--line2);border-radius:12px;padding:10px}
  .col h4{margin:0 0 8px;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .col h4 .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:#eef1f7;padding:1px 7px;border-radius:999px}
  .kcard{border-radius:9px;padding:8px 9px;margin-bottom:8px;background:#fff;border:1px solid var(--line2);border-left:3px solid var(--unknown)}
  .kcard .kt{font-size:12px;font-weight:600;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kcard .kx{font-size:11px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .b-text{border-left-color:var(--text)}.b-link{border-left-color:var(--link)}.b-code{border-left-color:var(--code)}
  .b-image{border-left-color:var(--image)}.b-files{border-left-color:var(--files)}
  .md{display:grid;grid-template-columns:280px 1fr;gap:0}.md .list{border-right:1px solid var(--line2);padding:8px;max-height:320px;overflow:auto}
  .mdrow{display:flex;gap:9px;align-items:center;padding:8px 9px;border-radius:9px}.mdrow.active{background:#eef4ff}
  .mdrow .idx{font-size:11px;color:var(--muted);width:14px;text-align:center}.mdrow .ti{font-size:12.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mdrow .tm{font-size:10.5px;color:var(--muted)}
  .md .preview{padding:16px;background:#fff}.md .pvhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .codeblk{background:#1e1e2e;color:#e6e6f0;border-radius:10px;padding:12px 14px;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;line-height:1.7;overflow:auto}
  .codeblk .k{color:#c792ea}.codeblk .s{color:#c3e88d}.codeblk .f{color:#82aaff}.codeblk .c{color:#676e95}
  .imgph{height:140px;border-radius:10px;background:linear-gradient(135deg,#E91E63,#9C27B0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
  .palette{background:#23252e;color:#e8e8ef;border-radius:16px;box-shadow:0 24px 60px rgba(10,12,30,.45);overflow:hidden;max-width:640px;margin:0 auto}
  .palette .psearch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #34384a}
  .palette .psearch .mag{width:16px;height:16px;border:2px solid #9aa0b5;border-radius:50%;position:relative}
  .palette .psearch .mag:after{content:"";position:absolute;width:7px;height:2px;background:#9aa0b5;bottom:-3px;right:-4px;transform:rotate(45deg)}
  .palette .psearch input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;outline:none}
  .prow{display:flex;align-items:center;gap:11px;padding:10px 16px;border-left:2px solid transparent}.prow.sel{background:#2c3142;border-left-color:#6c5ce7}
  .prow .num{width:20px;height:20px;border-radius:6px;background:#34384a;color:#cfd3e3;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .prow .pic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .prow .pt{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow .pt b{color:#ffd479;font-weight:600}.prow .ptm{font-size:11px;color:#8b90a5}
  .pfoot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid #34384a;font-size:11px;color:#9aa0b5}.pfoot kbd{background:#34384a;border-radius:5px;padding:1px 6px;color:#cfd3e3;font-family:inherit}
  .masonry{column-count:3;column-gap:12px}.tile{break-inside:avoid;margin-bottom:12px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff}
  .tile .tg{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:11px;font-weight:700;color:#fff}.tile .tc{padding:10px}.tile .tc .tt{font-size:12.5px;font-weight:600;margin:0 0 3px}.tile .tc .tx{font-size:11.5px;color:var(--muted);margin:0}
  .tile .tm{font-size:10.5px;color:var(--muted);padding:0 10px 9px}.tile.img .ph{height:96px;background:linear-gradient(135deg,#E91E63,#9C27B0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
  .tile.code .ph{height:70px;background:#1e1e2e;color:#c3e88d;font-family:monospace;font-size:10.5px;padding:10px;align-items:flex-start;overflow:hidden}

  /* ===== sticky notes ===== */
  .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px;padding:6px}
  .note-card{position:relative;padding:16px 14px 14px;border-radius:5px;box-shadow:0 6px 14px rgba(30,40,80,.16);transform:rotate(var(--rot,0deg));transition:transform .18s,box-shadow .18s;min-height:116px;font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive;color:#3a3a3a}
  .note-card:hover{transform:rotate(0deg) translateY(-5px) scale(1.02);box-shadow:0 16px 30px rgba(30,40,80,.26);z-index:3}
  .note-card:after{content:"";position:absolute;right:0;bottom:0;border-width:0 0 16px 16px;border-style:solid;border-color:transparent transparent rgba(0,0,0,.08) transparent;border-bottom-right-radius:5px}
  .n-yellow{background:#fff7a8}.n-pink{background:#ffd6e7}.n-blue{background:#cfe6ff}.n-green{background:#d6f5d6}.n-orange{background:#ffe2c2}.n-purple{background:#e7dcff}
  .note-card .pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#ff5f57;box-shadow:0 2px 4px rgba(0,0,0,.35),inset 0 -2px 3px rgba(0,0,0,.2)}
  .note-card .ntag{position:absolute;top:9px;right:9px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;color:#fff;font-family:sans-serif}
  .note-card .nbody{font-size:12.5px;line-height:1.5;margin:6px 0 8px}.note-card .nmeta{font-size:10px;color:#8a8a7a;font-family:sans-serif}
  /* ===== heat ===== */
  .heat{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.heat-wrap{flex:1;min-width:340px}
  .heat-months{display:flex;gap:0;font-size:10px;color:var(--muted);margin:0 0 4px 22px}.heat-row{display:flex;align-items:center;gap:3px;margin-bottom:3px}
  .heat-daylbl{width:18px;font-size:9px;color:var(--muted)}.heat-cells{display:flex;gap:3px}.hcell{width:11px;height:11px;border-radius:2px;background:var(--line2)}
  .heat-leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);margin-top:8px}.heat-leg .hcell{width:10px;height:10px}
  .heat-side{width:230px;background:#fafbff;border:1px solid var(--line2);border-radius:12px;padding:12px}.heat-side h4{margin:0 0 8px;font-size:13px}
  .heat-side .hr{display:flex;gap:8px;align-items:center;padding:6px 7px;border-radius:8px;margin-bottom:6px;background:#fff;border:1px solid var(--line2)}
  .heat-side .hr .ht{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heat-side .hr .hm{font-size:10px;color:var(--muted)}
  /* ===== source accordion ===== */
  .acc{border:1px solid var(--line2);border-radius:12px;overflow:hidden}.acc-head{display:flex;align-items:center;gap:10px;padding:11px 13px}
  .acc-head .ai{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
  .acc-head .an{font-size:13.5px;font-weight:700}.acc-head .ac{margin-left:auto;font-size:11px;color:var(--muted);background:#eef1f7;padding:1px 8px;border-radius:999px}.acc-head .ach{font-size:11px;color:var(--muted)}
  .acc-body{padding:4px 13px 11px}.acc-row{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:8px}.acc-row:hover{background:#f3f6ff}
  .acc-row .at{font-size:12.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acc-row .am{font-size:10.5px;color:var(--muted)}
  /* ===== tags ===== */
  .tags{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:4px 2px 10px}
  .tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600;cursor:default;transition:.15s}
  .tag:hover{border-color:var(--accent);background:#eef4ff}.tag .tc{font-size:10px;color:var(--muted);font-weight:700}
  .taglist{margin-top:6px;background:#fafbff;border:1px solid var(--line2);border-radius:12px;padding:8px 6px}
  .tagrow{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:9px}.tagrow:hover{background:#fff}
  .tagrow .tt{font-size:12.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tagrow .tm{font-size:10.5px;color:var(--muted)}.tagrow .ts{font-size:10px;color:var(--accent);font-weight:700}
  /* ===== gallery ===== */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .gcell{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff}
  .gcell .gph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;position:relative}
  .gcell .gph.img{height:104px}.gcell .gph.code{height:78px;background:#1e1e2e;color:#c3e88d;font-family:monospace;font-size:10px;padding:10px;align-items:flex-start;overflow:hidden}
  .gcell .gph.text{height:78px;background:#f3f6ff;color:var(--muted);font-size:11px;padding:10px;align-items:flex-start;overflow:hidden;text-align:left}
  .gcell .glbl{font-size:11px;padding:7px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.gcell .gmeta{font-size:10px;color:var(--muted);padding:0 9px 8px}
  /* ===== carousel ===== */
  .carousel{position:relative;display:flex;align-items:center;gap:10px}.cbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:18px;cursor:default;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 10px rgba(30,40,80,.08)}
  .cstage{flex:1;background:linear-gradient(135deg,#1f2233,#2c3150);border-radius:16px;padding:22px;color:#e8e8ef;min-height:190px;display:flex;flex-direction:column;justify-content:center}
  .cstage .chead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.cstage .chead b{font-size:15px}
  .cstage .cbody{font-size:13px;line-height:1.7;opacity:.95}.cstage .cbody.code{font-family:monospace;color:#c3e88d}
  .cdots{display:flex;justify-content:center;gap:6px;margin-top:12px}.cdots .d{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:default}.cdots .d.on{background:var(--accent);width:18px;border-radius:999px}

  /* ===== 卡片模式 v2 真实效果（来自 card-mode-v2.html） ===== */
  .card-scroll{overflow-x:auto;padding-bottom:12px}
  .card-row{display:flex;gap:14px;width:max-content;padding:4px 2px;align-items:stretch}
  .real-card{
    width:160px; height:160px; min-width:160px; max-width:160px; min-height:160px; max-height:160px; flex:0 0 160px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px; overflow:hidden;position:relative;
    display:flex;flex-direction:column; transition:transform .18s,border-color .18s,box-shadow .18s
  }
  .real-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px rgba(20,40,90,.10)}
  .real-card .top{height:4px;width:100%;flex-shrink:0}
  .real-card .top.tp-text{background:linear-gradient(90deg,#66BB6A,#4CAF50)}
  .real-card .top.tp-link{background:linear-gradient(90deg,#42A5F5,#2196F3)}
  .real-card .top.tp-code{background:linear-gradient(90deg,#FFB74D,#FF9800)}
  .real-card .top.tp-image{background:linear-gradient(90deg,#EC407A,#E91E63)}
  .real-card .top.tp-files{background:linear-gradient(90deg,#AB47BC,#9C27B0)}
  .real-card .pin-badge{position:absolute;top:8px;right:8px;z-index:2;display:flex;align-items:center;gap:3px;
    background:var(--accent);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;box-shadow:0 2px 6px rgba(0,120,212,.35)}
  .real-card .body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .real-card .foot{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px 10px}
  .real-card .chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
  .real-card .time{font-size:10px;color:var(--muted)}
  .real-card .actions{position:absolute;inset:0;background:rgba(255,255,255,.88);backdrop-filter:blur(4px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:9px;padding:11px;opacity:0;transition:opacity .18s;z-index:3;border-radius:14px}
  .real-card:hover .actions{opacity:1}
  .real-card .act-btn{border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:border-color .15s,background .15s,transform .1s}
  .real-card .act-btn:hover{transform:translateY(-1px)}
  .real-card .act-btn .ico{font-size:17px;line-height:1}
  .real-card .act-btn.del{color:#e53935;border-color:#f3b4b6;background:#fff5f5}
  .real-card .act-btn.pin{color:var(--accent)}
  .real-card.text .body{padding:10px 12px 4px}
  .real-card.text .content{flex:1 1 auto;min-height:0;font-size:11.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word;overflow:hidden}
  .real-card.text .more{font-size:10px;color:var(--accent);margin-top:3px;flex-shrink:0}
  .real-card.link .body{padding:10px 12px 4px}
  .real-card.link .domain{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-shrink:0}
  .real-card.link .fav{width:22px;height:22px;border-radius:6px;background:var(--link);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .real-card.link .url{font-size:11px;font-weight:600;color:var(--link);word-break:break-all;line-height:1.4;flex-shrink:0}
  .real-card.link .snippet{flex:1 1 auto;min-height:0;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5;overflow:hidden}
  .real-card.code .body{padding:9px 11px 4px}
  .real-card.code .lang{font-size:10px;font-weight:700;color:var(--code);margin-bottom:5px;display:flex;align-items:center;gap:5px;flex-shrink:0}
